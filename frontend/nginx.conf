server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfa uygulama: /admin gibi yollar da index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    server_tokens off;
}
